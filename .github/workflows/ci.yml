name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  drivers:
    name: driver tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the rusthinq ref
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < RUSTHINQ_REF)" >> "$GITHUB_OUTPUT"

      - name: Check out rusthinq
        uses: actions/checkout@v7
        with:
          repository: 3735943886/rusthinq
          ref: ${{ steps.ref.outputs.ref }}
          path: rusthinq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rusthinq

      - name: Build the driver runner
        run: >
          cargo build --release --manifest-path rusthinq/Cargo.toml
          -p rusthinq-devices --features scripting --bin rusthinq-script-test

      - name: Test and check the drivers
        run: rusthinq/target/release/rusthinq-script-test .
