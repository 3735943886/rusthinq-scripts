name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  drivers:
    name: rusthinq ${{ matrix.version }} driver tests and checks
    strategy:
      matrix:
        version: ["0.1", "0.2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the rusthinq ref
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < compat/${{ matrix.version }}/RUSTHINQ_REF)" >> "$GITHUB_OUTPUT"

      - name: Check out rusthinq
        uses: actions/checkout@v7
        with:
          repository: 3735943886/rusthinq
          ref: ${{ steps.ref.outputs.ref }}
          path: rusthinq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rusthinq

      - name: Build the 0.1 driver runner
        if: matrix.version == '0.1'
        run: >
          cargo build --release --manifest-path rusthinq/Cargo.toml
          -p rusthinq-devices --features scripting --bin rusthinq-script-test

      - name: Build the 0.2 driver runner
        if: matrix.version == '0.2'
        run: >
          cargo build --release --manifest-path rusthinq/Cargo.toml
          -p rusthinq-tools --bin rusthinq-script-test

      - name: Test runtime preparation
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Prepare the runtime directory
        run: python3 tools/prepare.py ${{ matrix.version }}

      - name: Test and check the drivers
        run: rusthinq/target/release/rusthinq-script-test dist/${{ matrix.version }}
