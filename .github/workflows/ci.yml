name: CI

on:
  push:
    branches: ["**"]
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]", "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  drivers:
    name: rusthinq 0.2 driver tests and checks
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.host.outputs.commit }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate the release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[1-9][0-9]*)?$ ]]
          day="${RELEASE_TAG:0:10}"
          [[ "$(date -d "${day//./-}" +%Y.%m.%d)" == "$day" ]]

      - name: Read the rusthinq ref
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < RUSTHINQ_REF)" >> "$GITHUB_OUTPUT"

      - name: Check out rusthinq
        uses: actions/checkout@v7
        with:
          repository: 3735943886/rusthinq
          ref: ${{ steps.ref.outputs.ref }}
          path: rusthinq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rusthinq

      - name: Build the driver runner
        run: >
          cargo build --release --manifest-path rusthinq/Cargo.toml
          -p rusthinq-tools --bin rusthinq-script-test

      - name: Test and check the drivers
        run: rusthinq/target/release/rusthinq-script-test .

      - name: Record the tested rusthinq commit
        id: host
        run: echo "commit=$(git -C rusthinq rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Publish dated release
    if: startsWith(github.ref, 'refs/tags/')
    needs: drivers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          HOST_COMMIT: ${{ needs.drivers.outputs.host }}
        run: |
          cat > notes.md <<EOF
          Device drivers for rusthinq 0.2, tested against rusthinq $HOST_COMMIT.
          For rusthinq 0.1, use the legacy branch and its earlier releases.

          Extract the source archive and point [drivers] directory at it. A copy of
          modules/il_config_common.rhai in that directory's root overrides the
          default descriptor prefix.
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file notes.md
